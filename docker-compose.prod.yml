# Pull-only deployment — no source checkout or Dockerfile needed.
#
# Paste this straight into Portainer's "Web editor" stack method, set the
# environment variables below, and deploy. Portainer will `docker pull` the
# prebuilt image from GitHub Container Registry instead of building it.
#
# Pin to a specific release instead of `latest` if you want predictable
# upgrades, e.g. ghcr.io/daezerwin/task-tracker:v1.0.0

services:
  app:
    image: ghcr.io/daezerwin/task-tracker:latest
    restart: unless-stopped
    # 8081 rather than 8080, so it can run on the same host as Baby Tracker.
    ports:
      - "8081:80"
    environment:
      APP_NAME: "Task Tracker"
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY is required — see README-DOCKER.md}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8081}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/task-tracker/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: "Task Tracker"
    volumes:
      - task_tracker_database:/var/lib/task-tracker
      - task_tracker_storage:/var/www/html/storage

volumes:
  task_tracker_database:
  task_tracker_storage:
